[package]
name = "finance-workbench"
version = "0.1.0"
description = "财务工作台"
edition = "2021"

[lib]
name = "finance_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
