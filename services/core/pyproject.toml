[project]
name = "finance-core"
version = "0.1.0"
description = "财务工作台本地服务：记账核心、本机 HTTP 接口、给 Hermes 的 MCP 工具"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
finance-core = "finance_core.api:main"
finance-mcp = "finance_core.mcp_server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
